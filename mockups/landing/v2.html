<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fantasy.recipes — landing redesign v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Mockup only: blockier pixel face. Self-host as woff2 for production. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #e9dcc3;
    --text: #2a2014;
    --frame-text: #f1e3c0;
    --frame-border: #7a5636;
    --frame-texture:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.16) 0, rgba(0,0,0,0.16) 2px, transparent 2px, transparent 9px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px),
      linear-gradient(180deg, #55381f 0%, #3c2614 60%, #2c1b0f 100%);
    --panel-bg: #fbf1da;
    --panel-text: #2a2014;
    --panel-border: #d9c49a;
    --panel-shadow: inset 0 0 0 1px rgba(122,86,40,0.12), 0 2px 10px rgba(44,27,15,0.18);
    --accent: #9c5a1e;
    --gem: #9c5a1e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202126;
      --text: #e7e2d3;
      --frame-text: #e7e2d3;
      --frame-border: #4c4d55;
      --frame-texture:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 2px, transparent 2px, transparent 11px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.18) 0, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 13px),
        linear-gradient(180deg, #3a3c43 0%, #2a2b30 55%, #1c1d21 100%);
      --panel-bg: #26272d;
      --panel-text: #e7e2d3;
      --panel-border: #45464e;
      --panel-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 2px 12px rgba(0,0,0,0.45);
      --accent: #e0a458;
      --gem: #e0a458;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, Cambria, 'Times New Roman', Times, serif;
  }

  /* ---- Hero: torch-lit wordmark ---- */
  .hero {
    position: relative;
    flex: 0 0 33vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow: hidden;
    background: var(--frame-texture);
    color: var(--frame-text);
    border-bottom: 3px solid var(--frame-border);
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 55% 70% at 50% 42%, rgba(255,178,92,0.22), transparent 70%);
    pointer-events: none;
  }
  .hero h1 {
    margin: 0;
    position: relative;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    line-height: 1.35;
    text-align: center;
    font-size: clamp(0.85rem, 3.6vw, 2.4rem);
    text-shadow: 4px 4px 0 rgba(0,0,0,0.45);
  }

  /* ---- Card row ---- */
  .card-row {
    flex: 1 1 auto;
    display: flex;
    gap: clamp(0.6rem, 2.2vw, 1.9rem);
    padding: clamp(1rem, 3.5vh, 2.5rem) clamp(1rem, 4vw, 3rem);
    align-items: center;
    justify-content: center;
  }

  /* MTG-ish: fixed portrait ratio, double frame, art window, title plate */
  .card {
    flex: 0 1 auto;
    height: min(100%, 62vh);
    aspect-ratio: 5 / 7;
    display: flex;
    flex-direction: column;
    padding: 8px;
    border: 2px solid var(--frame-border);
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.06)),
      var(--frame-texture);
    box-shadow: var(--panel-shadow), 0 6px 16px rgba(0,0,0,0.28);
    text-decoration: none;
    color: var(--frame-text);
    transition: transform 0.13s ease, box-shadow 0.13s ease;
  }
  .card:hover,
  .card:focus-visible {
    transform: translateY(-10px) rotate(-0.6deg);
    box-shadow: var(--panel-shadow), 0 20px 34px rgba(0,0,0,0.4);
    outline: none;
  }

  .card-art {
    flex: 1 1 auto;
    min-height: 0;
    margin-bottom: 8px;
    border: 3px solid var(--frame-border);
    border-radius: 8px;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    box-shadow: inset 0 0 22px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .card-art span {
    font-size: clamp(2rem, 6vw, 3.75rem);
    padding-bottom: 0.4em;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  }
  .art-recipes  { background-image: radial-gradient(circle at 50% 30%, #f0a24d, #6f2a0e 78%); }
  .art-writers  { background-image: url("../../public/images/writers/wrenna.jpg"); }
  .art-grimoire { background-image: radial-gradient(circle at 50% 30%, #5aa06a, #17331f 78%); }
  .art-login    { background-image: radial-gradient(circle at 50% 30%, #d8b45a, #4d3910 78%); }

  .card-name {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: clamp(0.5rem, 1.15vw, 0.8rem);
    text-transform: uppercase;
    padding: 0.7rem 0.5rem;
    background: var(--panel-bg);
    color: var(--panel-text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
  }
  .card-name::before {
    content: "";
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: var(--gem);
    box-shadow: 0 0 6px var(--gem);
    flex: 0 0 auto;
  }

  .site-footer {
    flex: 0 0 auto;
    text-align: center;
    padding: 1rem;
    background: var(--frame-texture);
    color: var(--frame-text);
    border-top: 3px solid var(--frame-border);
    font-size: 0.9rem;
  }
  .site-footer p { margin: 0.25rem 0; }
  .site-footer a { color: var(--frame-text); }

  @media (max-width: 760px) {
    .hero { flex-basis: auto; min-height: 28vh; }
    .card-row { flex-wrap: wrap; }
    .card { height: auto; width: calc(50% - 0.6rem); aspect-ratio: 5 / 7; }
  }
</style>
</head>
<body>
  <header class="hero">
    <h1>Fantasy<br>Recipes</h1>
  </header>

  <main class="card-row">
    <a class="card" href="/recipes">
      <span class="card-art art-recipes"><span>🍲</span></span>
      <span class="card-name">Recipes</span>
    </a>
    <a class="card" href="/writers">
      <span class="card-art art-writers"></span>
      <span class="card-name">Writers</span>
    </a>
    <a class="card" href="/grimoire">
      <span class="card-art art-grimoire"><span>📖</span></span>
      <span class="card-name">Grimoire</span>
    </a>
    <a class="card" href="/login">
      <span class="card-art art-login"><span>🔑</span></span>
      <span class="card-name">Login</span>
    </a>
  </main>

  <footer class="site-footer">
    <p>fantasy.recipes &mdash; every recipe is a ritual.</p>
    <p><a href="/terms">Terms &amp; conditions</a></p>
  </footer>
</body>
</html>
