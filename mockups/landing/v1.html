<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fantasy.recipes — landing redesign v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Mockup only: pixel headline face pulled from Google Fonts. For production
     this would be self-hosted as a woff2 (Pi / offline constraint). -->
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ---- tokens lifted from public/css/site.css so the mockup matches the
     real tavern palette, light + dark ---- */
  :root {
    color-scheme: light dark;
    --bg: #e9dcc3;
    --text: #2a2014;
    --frame-text: #f1e3c0;
    --frame-border: #7a5636;
    --frame-texture:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.16) 0, rgba(0,0,0,0.16) 2px, transparent 2px, transparent 9px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px),
      linear-gradient(180deg, #55381f 0%, #3c2614 60%, #2c1b0f 100%);
    --panel-bg: #fbf1da;
    --panel-text: #2a2014;
    --panel-border: #d9c49a;
    --panel-shadow: inset 0 0 0 1px rgba(122,86,40,0.12), 0 2px 10px rgba(44,27,15,0.18);
    --accent: #9c5a1e;
    --link: #7a3b1e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202126;
      --text: #e7e2d3;
      --frame-text: #e7e2d3;
      --frame-border: #4c4d55;
      --frame-texture:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 2px, transparent 2px, transparent 11px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.18) 0, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 13px),
        linear-gradient(180deg, #3a3c43 0%, #2a2b30 55%, #1c1d21 100%);
      --panel-bg: #26272d;
      --panel-text: #e7e2d3;
      --panel-border: #45464e;
      --panel-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 2px 12px rgba(0,0,0,0.45);
      --accent: #e0a458;
      --link: #e0a458;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, Cambria, 'Times New Roman', Times, serif;
  }

  /* ---- Hero: top third, pixel wordmark, no nav above it ---- */
  .hero {
    flex: 0 0 33vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: var(--frame-texture);
    color: var(--frame-text);
    border-bottom: 3px solid var(--frame-border);
    box-shadow: inset 0 -18px 40px rgba(0,0,0,0.35);
  }
  .hero h1 {
    margin: 0;
    font-family: 'Silkscreen', 'Courier New', monospace;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.05;
    text-align: center;
    letter-spacing: 0.04em;
    font-size: clamp(1.5rem, 6.5vw, 4.25rem);
    text-shadow: 3px 3px 0 rgba(0,0,0,0.4), 0 0 18px rgba(224,164,88,0.25);
  }

  /* ---- Card row: fills the rest of the fold ---- */
  .card-row {
    flex: 1 1 auto;
    display: flex;
    gap: clamp(0.6rem, 2vw, 1.75rem);
    padding: clamp(1rem, 3.5vh, 2.75rem) clamp(1rem, 4vw, 3rem);
    align-items: stretch;
    justify-content: center;
  }

  .card {
    flex: 1 1 0;
    max-width: 300px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 10px;
    border: 2px solid var(--frame-border);
    border-radius: 16px;
    background: var(--frame-texture);
    box-shadow: var(--panel-shadow);
    text-decoration: none;
    color: var(--frame-text);
    transition: transform 0.13s ease, box-shadow 0.13s ease;
  }
  .card:hover,
  .card:focus-visible {
    transform: translateY(-8px);
    box-shadow: var(--panel-shadow), 0 14px 28px rgba(0,0,0,0.35);
    outline: none;
  }

  /* card "art" — placeholder gradients, one identity per card */
  .card-art {
    flex: 1 1 auto;
    min-height: 0;
    border: 1px solid var(--frame-border);
    border-radius: 10px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2.5rem, 7vw, 4.5rem);
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
  }
  .art-recipes  { background: radial-gradient(circle at 50% 35%, #f0a24d, #7a2f10 75%); }
  .art-writers  { background: radial-gradient(circle at 50% 35%, #6f7fc0, #23264d 75%); }
  .art-grimoire { background: radial-gradient(circle at 50% 35%, #5aa06a, #1d3b2a 75%); }
  .art-login    { background: radial-gradient(circle at 50% 35%, #d8b45a, #5b4412 75%); }

  .card-name {
    font-family: 'Silkscreen', 'Courier New', monospace;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: clamp(0.7rem, 1.5vw, 1rem);
    padding: 0.55rem 0.4rem;
    background: var(--panel-bg);
    color: var(--panel-text);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
  }

  /* ---- Footer: unchanged from the live site ---- */
  .site-footer {
    flex: 0 0 auto;
    text-align: center;
    padding: 1rem;
    background: var(--frame-texture);
    color: var(--frame-text);
    border-top: 3px solid var(--frame-border);
    font-size: 0.9rem;
  }
  .site-footer p { margin: 0.25rem 0; }
  .site-footer a { color: var(--frame-text); }

  /* ---- Narrow screens: 2x2 card grid, hero relaxes ---- */
  @media (max-width: 720px) {
    .hero { flex-basis: auto; min-height: 30vh; }
    .card-row { flex-wrap: wrap; }
    .card { flex-basis: calc(50% - 0.6rem); max-width: none; }
    .card-art { min-height: 22vh; }
  }
</style>
</head>
<body>
  <header class="hero">
    <h1>Fantasy<br>Recipes</h1>
  </header>

  <main class="card-row">
    <a class="card" href="/recipes">
      <span class="card-art art-recipes">🍲</span>
      <span class="card-name">Recipes</span>
    </a>
    <a class="card" href="/writers">
      <span class="card-art art-writers">✒️</span>
      <span class="card-name">Writers</span>
    </a>
    <a class="card" href="/grimoire">
      <span class="card-art art-grimoire">📖</span>
      <span class="card-name">Grimoire</span>
    </a>
    <a class="card" href="/login">
      <span class="card-art art-login">🔑</span>
      <span class="card-name">Login</span>
    </a>
  </main>

  <footer class="site-footer">
    <p>fantasy.recipes &mdash; every recipe is a ritual.</p>
    <p><a href="/terms">Terms &amp; conditions</a></p>
  </footer>
</body>
</html>
