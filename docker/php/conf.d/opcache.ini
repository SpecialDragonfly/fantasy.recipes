; Sized for a 4 GB Pi 4 shared with MariaDB and the reverse proxy.
; validate_timestamps=0 means PHP won't notice source changes until php-fpm
; restarts -- which the deploy flow (`docker compose up -d --build`) already
; does on every deploy.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
