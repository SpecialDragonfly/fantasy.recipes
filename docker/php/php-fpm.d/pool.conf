; Sized for a 4 GB Pi 4 shared with the host's MariaDB (128 MB buffer pool),
; the reverse proxy and Docker. A Slim/Twig worker is roughly 30-50 MB, so
; 8 workers is ~400 MB worst case.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
