server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 10m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # nginx:alpine's mime.types has no .webmanifest entry. A server-level
    # `types {}` block would REPLACE the whole map (breaking css/js/etc), so
    # set the type just for this one file. `location =` still serves it as a
    # normal static file.
    location = /images/favicon/site.webmanifest {
        default_type application/manifest+json;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # This container sits behind the host's existing nginx reverse
        # proxy (see architecture.md -- Deployment & Networking). Trust the
        # forwarded scheme so Slim/PHP know the original request was HTTPS
        # even though it arrives here as plain HTTP.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
